[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0.223", features = ["derive"] }
sea-orm = { version = "1.1.16", features = [
  "sqlx-sqlite",
  "runtime-tokio-rustls",
] }
tokio = { version = "1.47.1", features = ["signal", "rt-multi-thread", "fs"] }
dotenv = "0.15.0"
tracing = "0.1.41"
figment = { version = "0.10.19", features = ["env", "toml"] }
serde_json = "1.0.143"
centaurus = { version = "0.4.3", features = [
  "axum",
  "logging",
  "argon2",
  "base64",
  "chrono",
  "jsonwebtoken",
  "rsa",
  "sea-orm",
  "uuid",
  "reqwest",
  "auth",
  "docker",
] }
uuid = { version = "1.18.1", features = ["v4"] }
axum = { version = "0.8.4", features = [
  "macros",
  "ws",
  "tracing",
  "multipart",
] }
axum-extra = { version = "0.10.1", features = ["cookie", "typed-header"] }
tower-http = { version = "0.6.6", features = ["fs"] }
http = "1.3.1"
base64 = "0.22.1"
chrono = { version = "0.4.42", features = ["serde"] }
eyre = "0.6.12"
color-eyre = "0.6.5"
jsonwebtoken = { version = "10.0.0", features = ["rust_crypto"] }
rsa = "0.9.8"
argon2 = { version = "0.5.3", features = ["std"] }
entity = { path = "entity" }
migration = { path = "migration" }
time = "0.3.44"
hyper-util = { version = "0.1.17", features = ["client-legacy"] }
url = "2.5.7"
reqwest = { version = "0.12.23", features = [
  "json",
  "rustls-tls",
  "charset",
  "http2",
  "system-proxy",
  "multipart",
], default-features = false }
bollard = { version = "0.19.4", features = ["ssl"] }
clap = "4.5.51"
futures = "0.3.31"
tar = "0.4.44"
async-trait = "0.1.89"

[features]
# only used for testing purposes
test = []

[[bin]]
name = "backend"
path = "src/main.rs"
