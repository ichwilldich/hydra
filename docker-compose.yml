services:
  frontend:
    image: ghcr.io/profiidev/images/node-alpine-dev:main
    pull_policy: always
    volumes:
      - .:/app
    tty: true
    ports:
      - "5174:5174"
    networks:
      - proxy
    # command: npm install
    command: npm run dev -- --host
    working_dir: /app/frontend

  backend:
    image: ghcr.io/profiidev/images/rust-musl-watch:main
    pull_policy: always
    volumes:
      - ./backend:/app/backend
      - /var/run/docker.sock:/var/run/docker.sock
    working_dir: /app/backend
    networks:
      - proxy
    ports:
      - "5173:8000"
    tty: true
    entrypoint: ["tini", "--"]
    command: ["cargo", "watch", "-x", "run server"]
    environment:
      - RUST_LIB_BACKTRACE=0

networks:
  proxy:
